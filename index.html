<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKILL.md Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 0.4rem;
      color: #555;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #444;
    }

    label .hint {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #888;
      font-size: 0.78rem;
      margin-left: 0.4rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.92rem;
      color: #1a1a1a;
      background: #fafafa;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      background: #fff;
    }

    textarea {
      min-height: 120px;
      line-height: 1.55;
    }

    textarea.tall {
      min-height: 80px;
    }

    .divider {
      border: none;
      border-top: 1px solid #ececec;
      margin: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.65rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #downloadBtn {
      background: #4f46e5;
      color: #fff;
    }

    #downloadBtn:hover { background: #4338ca; }

    #copyBtn {
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }

    #copyBtn:hover { background: #e0e7ff; }

    #clearBtn {
      background: transparent;
      color: #666;
      border: 1px solid #d0d0d0;
    }

    #clearBtn:hover { background: #f5f5f5; color: #333; }

    .toast {
      display: none;
      font-size: 0.85rem;
      color: #16a34a;
      font-weight: 500;
    }

    .toast.visible { display: inline; }

    .preview-card {
      position: sticky;
      top: 1rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.25rem;
      border-bottom: 1px solid #ececec;
      background: #fafafa;
    }

    .preview-header span {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #444;
    }

    .filename {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: #4f46e5;
      background: #eef2ff;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      text-transform: none;
      letter-spacing: 0;
    }

    pre#preview {
      margin: 0;
      padding: 1.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1a1a1a;
      max-height: 75vh;
      overflow-y: auto;
    }

    .cleanup-note {
      display: none;
      font-size: 0.82rem;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
    }

    .cleanup-note.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SKILL.md Generator</h1>
      <p>Fill in each section, then download a ready-to-use <code>SKILL.md</code> file. Text pasted from Google Docs or Word is automatically cleaned (smart quotes, escaped characters, invisible characters).</p>
    </header>

    <div class="layout">
      <div class="card">
        <div class="field">
          <label for="title">Skill Title</label>
          <input type="text" id="title" placeholder="e.g. CRISPR-Cas9 gRNA Selection for HDR Knock-ins" />
        </div>

        <hr class="divider" />

        <div class="field">
          <label for="whenToUse">When to Use This Skill
            <span class="hint">— first line becomes the file description</span>
          </label>
          <textarea id="whenToUse" placeholder="Describe when this skill should be applied…"></textarea>
        </div>

        <div class="field">
          <label for="coreFramework">Core Framework</label>
          <textarea id="coreFramework" placeholder="List the core steps or principles…"></textarea>
        </div>

        <div class="field">
          <label for="conventions">Key Conventions &amp; Professional Norms</label>
          <textarea id="conventions" placeholder="Describe conventions and norms to follow…"></textarea>
        </div>

        <div class="field">
          <label for="errors">Common Errors to Avoid</label>
          <textarea id="errors" placeholder="List frequent mistakes…"></textarea>
        </div>

        <div class="field">
          <label for="heuristics">Decision Rules / Heuristics</label>
          <textarea id="heuristics" placeholder="Describe decision rules or quick heuristics…"></textarea>
        </div>

        <div class="field">
          <label for="example">Example Application</label>
          <textarea id="example" class="tall" placeholder="Provide a worked example…"></textarea>
        </div>

        <hr class="divider" />

        <div class="cleanup-note" id="cleanupNote"></div>

        <div class="actions">
          <button id="downloadBtn" onclick="download()">Download SKILL.md</button>
          <button id="copyBtn" onclick="copyToClipboard()">Copy to Clipboard</button>
          <button id="clearBtn" onclick="clearForm()">Clear</button>
          <span class="toast" id="toast">Downloaded!</span>
        </div>
      </div>

      <div class="preview-card">
        <div class="preview-header">
          <span>Live Preview</span>
          <span class="filename">SKILL.md</span>
        </div>
        <pre id="preview"></pre>
      </div>
    </div>
  </div>

  <script>
    const FIELD_IDS = ['title', 'whenToUse', 'coreFramework', 'conventions', 'errors', 'heuristics', 'example'];

    let cleanupCount = 0;

    // Fixes the most common artifacts introduced by Google Docs / Word exports:
    // smart quotes, unicode dashes/ellipses, non-breaking and zero-width
    // spaces, and backslash-escaped markdown punctuation.
    function sanitize(text) {
      const before = text;
      let out = text
        .replace(/[\u2018\u2019\u201A\u201B]/g, "'")
        .replace(/[\u201C\u201D\u201E\u201F]/g, '"')
        .replace(/\u2026/g, '...')
        .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g, ' ')
        .replace(/[\u200B-\u200D\uFEFF\u00AD]/g, '')
        .replace(/\r\n?/g, '\n')
        .replace(/\\([\\`*_{}\[\]()#+\-.!>|~])/g, '$1');
      if (out !== before) cleanupCount++;
      return out;
    }

    function val(id) {
      return sanitize(document.getElementById(id).value).trim();
    }

    // Slug for the YAML `name:` field: lowercase letters, digits, hyphens.
    function slugify(title) {
      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 64)
        .replace(/-+$/g, '');
      return slug || 'task-skill';
    }

    // Quote the YAML description so ':', '#', quotes etc. can't break the frontmatter.
    function yamlQuote(s) {
      return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }

    function buildMarkdown() {
      cleanupCount = 0;
      const title         = val('title');
      const whenToUse     = val('whenToUse');
      const coreFramework = val('coreFramework');
      const conventions   = val('conventions');
      const errors        = val('errors');
      const heuristics    = val('heuristics');
      const example       = val('example');

      const description = whenToUse.split('\n').find(l => l.trim())?.trim() || '';

      const md = [
        '---',
        `name: ${slugify(title)}`,
        `description: ${yamlQuote(description)}`,
        '---',
        '',
        `# ${title || 'Untitled Skill'}`,
        '',
        '## When to Use This Skill',
        '',
        whenToUse,
        '',
        '## Core Framework',
        '',
        coreFramework,
        '',
        '## Key Conventions & Professional Norms',
        '',
        conventions,
        '',
        '## Common Errors to Avoid',
        '',
        errors,
        '',
        '## Decision Rules / Heuristics',
        '',
        heuristics,
        '',
        '## Example Application',
        '',
        example,
        '',
      ].join('\n').replace(/\n{3,}/g, '\n\n');

      const note = document.getElementById('cleanupNote');
      if (cleanupCount > 0) {
        note.textContent = 'Cleaned up formatting artifacts (smart quotes, escaped characters, or invisible characters) from pasted text.';
        note.classList.add('visible');
      } else {
        note.classList.remove('visible');
      }

      return md;
    }

    function updatePreview() {
      document.getElementById('preview').textContent = buildMarkdown();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2000);
    }

    function download() {
      const blob = new Blob([buildMarkdown()], { type: 'text/markdown' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'SKILL.md';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloaded!');
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(buildMarkdown()).then(() => showToast('Copied!'));
    }

    function clearForm() {
      FIELD_IDS.forEach(id => { document.getElementById(id).value = ''; });
      updatePreview();
    }

    FIELD_IDS.forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    updatePreview();
  </script>
</body>
</html>
